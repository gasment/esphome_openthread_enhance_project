name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aioesphomeapi==46.25.0 aiohttp voluptuous aiohttp voluptuous aiohttp voluptuous aiohttp voluptuous aiohttp voluptuous
      - run: python -m unittest discover -s thread_sed/tests -v
      - run: python -m unittest discover -s thread_proxy/tests -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
